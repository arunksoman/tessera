<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grid spike</title>
<style>
  /* Follows the system until a user choice sets data-theme. */
  :root { color-scheme: light dark; }
  :root[data-theme=light] { color-scheme: light; }
  :root[data-theme=dark] { color-scheme: dark; }
  html, body { margin: 0; height: 100%; font: 13px/28px monospace; }
  #viewport { background: light-dark(#FFFFFF, #1C1F25); color: light-dark(#1C1F24, #E7E9EC); position: relative; height: 100vh; overflow: auto; contain: strict; }
  #spacer { width: 1px; }
  #window { position: sticky; top: 0; height: 0; width: max-content; }
  .row { position: absolute; left: 0; height: 28px; display: flex; will-change: transform; contain: layout paint; }
  .cell { width: 120px; flex: none; overflow: hidden; white-space: nowrap; box-sizing: border-box; padding: 0 6px; border-right: 1px solid light-dark(#DDD, #333A44); border-bottom: 1px solid light-dark(#EEE, #2A3038); }
</style>
</head>
<body>
<div id="viewport" role="grid" aria-label="Spike results" tabindex="0">
  <div id="window" role="presentation"></div>
  <div id="spacer"></div>
</div>
<script src="grid.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  window.grid = createGrid(document.getElementById('viewport'), {
    rows: Number(params.get('rows') || 1_000_000),
    cols: Number(params.get('cols') || 20),
    cell: (r, c) => `r${r}c${c}`,
  });
</script>
</body>
</html>
