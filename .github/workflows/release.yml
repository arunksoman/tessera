name: Release

# Push a tag like v0.1.0 on a commit in main. The annotated tag's message becomes the release notes.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tag to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  release:
    needs: [check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check the build is reproducible
        run: |
          scripts/release-build.sh "$VERSION"
          cp dist/sha256sums.txt first-sums.txt
          scripts/release-build.sh "$VERSION"
          diff first-sums.txt dist/sha256sums.txt
      - name: Check the binary reports this version
        run: |
          tar -xzf "dist/tess_${VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/tess_${VERSION}_linux_amd64/tess" version)" = "tess $VERSION"
      - name: Create the SBOM
        run: go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 app -json -main cmd/tess -output "dist/tess_${VERSION}_sbom.cdx.json"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.cdx.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-from-tag --title "Tessera $VERSION"
