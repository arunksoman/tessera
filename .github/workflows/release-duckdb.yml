name: Release DuckDB plugin

# Push an annotated tag like duckdb-v0.1.0 on a commit in main. The tag's message becomes the
# release notes. Users install the release with:
#   tess plugin install duckdb --from github:arunksoman/tessera@duckdb-v0.1.0
# The release is never marked latest, because the latest release of this repository is tess.
#
# Needs the repository secret TESSERA_PLUGIN_SIGNING_KEY: the private key file from
# `tess plugin keygen`, whose public key users trust with `tess plugin trust`.
on:
  push:
    tags: ["duckdb-v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      min_tess: ${{ steps.version.outputs.min_tess }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tag to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # The plugin needs the protocol of the tess it was built with, so it asks for the newest
      # tess release made before it.
      - id: version
        run: |
          echo "version=${GITHUB_REF_NAME#duckdb-v}" >>"$GITHUB_OUTPUT"
          echo "min_tess=$(git describe --tags --match 'v[0-9]*' --abbrev=0 | sed 's/^v//')" >>"$GITHUB_OUTPUT"

  build:
    needs: check
    uses: ./.github/workflows/duckdb.yml
    with:
      version: ${{ needs.check.outputs.version }}
      min_tess: ${{ needs.check.outputs.min_tess }}

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      MIN_TESS: ${{ needs.check.outputs.min_tess }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8 # dependabot will pin to a SHA
        with:
          path: dist
          merge-multiple: true
      - name: Write the descriptor
        working-directory: dist
        run: |
          artifacts='{}'
          for bin in tess-duckdb-*; do
            target=${bin#tess-duckdb-}
            target=${target%.exe}
            artifacts=$(jq --arg t "${target/-//}" --arg u "$bin" --arg s "$(sha256sum "$bin" | cut -d' ' -f1)" \
              '. + {($t): {url: $u, sha256: $s}}' <<<"$artifacts")
          done
          jq -n --arg v "$VERSION" --arg m "$MIN_TESS" --argjson a "$artifacts" '{
            name: "duckdb", version: $v, api_version: 0,
            description: "DuckDB database files",
            homepage: "https://github.com/arunksoman/tessera/tree/main/plugins/duckdb",
            min_tess: $m, artifacts: $a
          }' >tessera-plugin.json
          cat tessera-plugin.json
      - name: Sign the descriptor
        env:
          KEY: ${{ secrets.TESSERA_PLUGIN_SIGNING_KEY }}
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/tess" ./cmd/tess
          umask 077
          printf '%s\n' "$KEY" >"$RUNNER_TEMP/plugin.key"
          "$RUNNER_TEMP/tess" plugin sign --key "$RUNNER_TEMP/plugin.key" dist/tessera-plugin.json
          rm "$RUNNER_TEMP/plugin.key"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tess-duckdb-*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-from-tag --latest=false --title "DuckDB plugin $VERSION"
