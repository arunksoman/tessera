name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: Direct dependencies are justified
        if: runner.os == 'Linux'
        run: scripts/check-deps.sh
      - run: go vet ./...
      - run: go vet -tags integration ./...
      - run: go test -count=1 ./...
      - run: go build -trimpath -ldflags="-s -w" -o tess-bin ./cmd/tess

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: docker compose --profile matrix up -d --wait --build
      - run: go test -tags integration -count=1 -timeout 10m ./internal/tiles/... ./internal/cli/... ./internal/tui/...
        env:
          TESSERA_TEST_MATRIX: "1"
      - if: failure()
        run: docker compose --profile matrix logs --tail 50

  vulnerabilities:
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Analysis depends on the target platform, so scan each one.
      - run: GOOS=${{ matrix.goos }} govulncheck ./...
